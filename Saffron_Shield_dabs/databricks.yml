# This is a Declarative Automation Bundle definition for Saffron_Shield_dabs.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: Saffron_Shield_dabs
  uuid: 1c137a7d-6271-45f7-8dea-1c8e6f3a63cd

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-af5175d7-cbe7.cloud.databricks.com
    variables:
      catalog: claims
  prod:
    mode: production
    workspace:
      host: https://dbc-af5175d7-cbe7.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/surajitm0nd0l12@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/surajitm0nd0l12@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prod
    permissions:
      - user_name: surajitm0nd0l12@gmail.com
        level: CAN_MANAGE
